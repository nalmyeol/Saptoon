<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SPA-TOON - 스마트 웹툰 연재 플랫폼</title>
  <style>
    /* 테마별 색상 변수 설정 */
    :root {
      --bg-main: #0b0f17;
      --bg-header: rgba(11, 15, 23, 0.95);
      --border-color: #1e293b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --bg-card: #121824;
      --bg-card-hover: #1a2232;
      --bg-input: #161f2e;
      --border-input: #1e293b;
      --modal-bg: #121824;
      --chip-bg: #1a2232;
      --chip-text: #94a3b8;
      --chip-border: #334155;
    }
    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-header: rgba(248, 250, 252, 0.95);
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-input: #ffffff;
      --border-input: #cbd5e1;
      --modal-bg: #ffffff;
      --chip-bg: #f1f5f9;
      --chip-text: #475569;
      --chip-border: #cbd5e1;
    }
  </style>
</head>
<body>
  <div style="padding: 40px; text-align: center; font-family: sans-serif;">
    <h1>SPA-TOON 플랫폼 준비 중</h1>
    <p> Supabase 연동 및 웹툰 리스트를 불러오고 있습니다.</p>
  </div>
</body>
</html>
